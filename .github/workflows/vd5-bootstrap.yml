name: VD5 cosmetics reconstruction

on:
  pull_request:
    branches:
      - chatgpt/vd4-secondary-screens-reconstruction
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-cosmetics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out VD5 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vd5-cosmetics-reconstruction
          fetch-depth: 0

      - name: Apply VD5 cosmetics migration
        run: |
          python3 design/vd5_patch.py
          python3 design/vd5_fix.py

      - name: Validate VD5 contract
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'name="voidcut-visual-phase" content="VD5"',
            '/* === VD5 CUTFORM COSMETICS',
            "const VD5_COSMETICS_VERSION='VD5.0.0'",
            "Object.defineProperty(window,'VoidcutCosmetics'",
            "arena:{label:'FIELD',title:'FIELD MATERIALS'",
            "ball:{label:'DISC',title:'DISC CONSTRUCTIONS'",
            "trail:{label:'TRACE',title:'MOTION TRACES'",
            "collapse:{label:'REMOVAL',title:'REMOVAL MOTION'",
            'class="vd5-live-specimen"',
            'class="cos-card-desc"',
            'FIVE-LAYER MATERIAL SYSTEM',
            "const VD4_SECONDARY_VERSION='VD4.0.0'",
            "const VD3_SHELL_VERSION='VD3.0.0'",
            "const VD2_HUD_VERSION='VD2.0.0'",
            'drawCoreLightField(){return}',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing VD5 tokens: '+', '.join(missing))
          if text.count('/* === VD5 CUTFORM COSMETICS') != 1: raise SystemExit('VD5 CSS marker must occur exactly once')
          if text.count('// === VD5 COSMETICS CONTRACT') != 1: raise SystemExit('VD5 JS marker must occur exactly once')
          start=text.index('<section id="cosmeticsPanel"')
          end=text.index('<section id="settingsPanel"',start)
          chunk=text[start:end]
          for legacy in ['cos-showroom-svg','hero-wire hero-wire-1','LIVE PREVIEW','ALL FIVE EFFECTS']:
            if legacy in chunk: raise SystemExit('Legacy cosmetics showroom token remains in active markup: '+legacy)
          for token in ["['void','COATED'","['reactor','TARGET'","['laser','DOUBLE CUT'","['implode','PUNCH'"]:
            if token not in text: raise SystemExit('Cosmetic identity mapping missing: '+token)
          for name,expected in {
            'voidcut-build':'6.0.0','voidcut-save-schema':'16','voidcut-replay-version':'8',
            'voidcut-arena-generation':'2','voidcut-director-generation':'6','voidcut-daily-generation':'1'
          }.items():
            m=re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"',text)
            if not m or m.group(1)!=expected: raise SystemExit(f'Contract changed: {name}')
          HTMLParser().feed(text)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          inline=max(scripts,key=len)
          Path('/tmp/voidcut-inline.js').write_text(inline,encoding='utf-8')
          print('VD5 static contract PASS')
          print('HTML bytes:',len(text.encode('utf-8')))
          print('Inline JS bytes:',len(inline.encode('utf-8')))
          PY
          node --check /tmp/voidcut-inline.js

      - name: Commit reconstructed cosmetics
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains VD5 cosmetics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "VD5: reconstruct cosmetics material library"
          git push origin HEAD:chatgpt/vd5-cosmetics-reconstruction
