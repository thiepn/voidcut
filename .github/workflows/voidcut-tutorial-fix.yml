name: Voidcut tutorial fix

on:
  push:
    paths:
      - '.github/workflows/voidcut-tutorial-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch tutorial flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def swap(old, new, expected=1):
              global s
              found = s.count(old)
              if found != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {found}: {old[:120]}')
              s = s.replace(old, new)

          swap(
              "tutorialStep=step||(stage===1?'collapse':stage===2?'divider':'setupDivider');",
              "tutorialStep=step||(stage===1?'collapse':stage===2?'setupDivider':'scoring');"
          )

          old_refresh = "function refreshTutorialPrompt(){clearTimeout(coachTimer);ui.tutorial.classList.add('training');ui.tutorial.classList.remove('hidden');if(tutorialStage===1)setTutorial('LESSON 1 / 3 • COLLAPSE','Swipe vertically through the highlighted guide.','The side with no core disappears.');else if(tutorialStage===2)setTutorial('LESSON 2 / 3 • DIVIDER','Cut between the two cores.','Both sides contain a core, so the line stays as a divider.');else if(tutorialStep==='setupDivider')setTutorial('LESSON 3 / 3 • SETUP','First split the two cores with a divider.','Then use that divider to carve away empty space safely.');else setTutorial('LESSON 3 / 3 • USE THE SETUP','Now cut empty space from the outside of either core.','The divider keeps the cores isolated while you trim the field.');announce(ui.tutorial.textContent)}"
          new_refresh = "function refreshTutorialPrompt(){clearTimeout(coachTimer);ui.tutorial.classList.add('training');ui.tutorial.classList.remove('hidden');if(tutorialStage===1)setTutorial('LESSON 1 / 3 • COLLAPSE','Swipe vertically through the highlighted guide.','The side with no core disappears.');else if(tutorialStage===2&&tutorialStep==='setupDivider')setTutorial('LESSON 2 / 3 • SETUP','First split the two cores with a divider.','Then use that divider to carve away empty space safely.');else if(tutorialStage===2)setTutorial('LESSON 2 / 3 • USE THE SETUP','Now cut empty space from the outside of either core.','The divider keeps the cores isolated while you trim the field.');else showTutorialScoring();if(tutorialStage!==3)announce(ui.tutorial.textContent)}"
          swap(old_refresh, new_refresh)

          marker = "function startInteractiveTutorial(returnTo='run')"
          scoring_fn = "function showTutorialScoring(){tutorialLocked=true;ui.tutorial.innerHTML=`<span class=\"tutorial-kicker\">LESSON 3 / 3 • CLEAR & SCORE</span><strong>Remove at least 75% of the arena to clear a normal chamber.</strong><br>Removed area earns points. Bigger cuts and close calls multiply them; clearing adds a chamber bonus, and fewer cuts add an efficiency bonus. Dividers are setup tools and score 0.<br><button id=\"tutorialContinue\" class=\"primary\" style=\"width:100%;margin-top:12px\">START RUN</button>`;const btn=$('tutorialContinue');if(btn)btn.addEventListener('click',()=>{if(tutorialMode&&tutorialStage===3)completeInteractiveTutorial()},{once:true});announce('Lesson 3 of 3. Clear and score. Remove at least 75 percent of a normal arena to clear it. Removed area earns points. Bigger cuts and close calls multiply points. Chamber clears and fewer cuts add bonuses. Dividers score zero.')}\n"
          if marker not in s:
              raise SystemExit('Tutorial start marker not found')
          s = s.replace(marker, scoring_fn + marker, 1)

          old_complete = "function completeInteractiveTutorial(){tutorialLocked=true;save.tutorialSeen=true;save.dividerTutorialSeen=true;persist();showCoach('TRAINING COMPLETE','Empty space collapses. Cores on both sides create dividers.','You are ready for a live run.',1250);ui.tutorial.classList.add('training');masteryGradeSound('S',0);tutorialTimer=setTimeout(()=>{const ret=tutorialReturn;tutorialMode=false;tutorialLocked=false;ui.tutorial.classList.remove('training');ui.tutorial.classList.add('hidden');if(ret==='settings'){showMenu();showSettings('menu');showCoach('TUTORIAL COMPLETE','Replay it anytime from Settings.','',900)}else if(ret==='daily')startDaily(true);else if(ret==='challenge'&&pendingTutorialChallenge){const target=pendingTutorialChallenge;pendingTutorialChallenge=null;start(target,true)}else start(null,true)},1300)}"
          new_complete = "function completeInteractiveTutorial(){tutorialLocked=true;save.tutorialSeen=true;save.dividerTutorialSeen=true;persist();showCoach('TRAINING COMPLETE','Remove at least 75% to clear a normal chamber.','Bigger, riskier and more efficient cuts score more.',1250);ui.tutorial.classList.add('training');masteryGradeSound('S',0);tutorialTimer=setTimeout(()=>{const ret=tutorialReturn;tutorialMode=false;tutorialLocked=false;ui.tutorial.classList.remove('training');ui.tutorial.classList.add('hidden');if(ret==='settings'){showMenu();showSettings('menu');showCoach('TUTORIAL COMPLETE','Replay it anytime from Settings.','',900)}else if(ret==='daily')startDaily(true);else if(ret==='challenge'&&pendingTutorialChallenge){const target=pendingTutorialChallenge;pendingTutorialChallenge=null;start(target,true)}else start(null,true)},1300)}"
          swap(old_complete, new_complete)

          old_handler = "function handleTutorialResolution(r){if(!tutorialMode)return false;if(tutorialStage===1){if(r.divider){tutorialResetCurrent('Make a cut with the core on only one side.');return true}showCoach('EMPTY SPACE COLLAPSES','Correct. The side without a core was removed.','Next: learn why some cuts become dividers.',760);ui.tutorial.classList.add('training');tutorialNextStage(2);return true}if(tutorialStage===2){if(!r.divider){tutorialResetCurrent('Place the cut between the two cores so each side keeps one.');return true}showCoach('DIVIDER CREATED','Correct. Both sides had a core, so neither side collapsed.','Next: use a divider as a setup tool.',780);ui.tutorial.classList.add('training');tutorialNextStage(3);return true}if(tutorialStep==='setupDivider'){if(!r.divider){tutorialResetCurrent('First separate the two cores with a divider.');return true}tutorialStep='setupCollapse';tutorialLocked=false;refreshTutorialPrompt();return true}if(r.divider){showCoach('KEEP TRIMMING','That was another divider.','Cut an outer empty section so one side has no core.',900);ui.tutorial.classList.add('training');return true}completeInteractiveTutorial();return true}"
          new_handler = "function handleTutorialResolution(r){if(!tutorialMode)return false;if(tutorialStage===1){if(r.divider){tutorialResetCurrent('Make a cut with the core on only one side.');return true}showCoach('EMPTY SPACE COLLAPSES','Correct. The side without a core was removed.','Next: use a divider as a setup tool.',760);ui.tutorial.classList.add('training');tutorialNextStage(2);return true}if(tutorialStage===2){if(tutorialStep==='setupDivider'){if(!r.divider){tutorialResetCurrent('First separate the two cores with a divider.');return true}tutorialStep='setupCollapse';tutorialLocked=false;refreshTutorialPrompt();return true}if(r.divider){showCoach('KEEP TRIMMING','That was another divider.','Cut an outer empty section so one side has no core.',900);ui.tutorial.classList.add('training');return true}showCoach('SETUP COMPLETE','Correct. The divider let you remove empty space safely.','Next: learn the clear target and scoring.',760);ui.tutorial.classList.add('training');tutorialNextStage(3);return true}return true}"
          swap(old_handler, new_handler)

          swap("tutorialStage===2||tutorialStep==='setupDivider'", "tutorialStep==='setupDivider'", expected=3)
          swap("else if(tutorialStage===3&&tutorialStep==='setupCollapse')x=AX+AW*.18;", "else if(tutorialStep==='setupCollapse')x=AX+AW*.18;")

          swap(
              "const p=vd1Palette(),title=tutorialStage===1?'COLLAPSE':tutorialStage===2?'DIVIDER':tutorialStep==='setupDivider'?'SETUP':'USE THE SETUP',x=40,y=42,w=640,h=88;",
              "const p=vd1Palette(),title=tutorialStage===1?'COLLAPSE':tutorialStage===2?(tutorialStep==='setupDivider'?'SETUP':'TRIM'):'CLEAR & SCORE',x=40,y=42,w=640,h=88;"
          )

          path.write_text(s, encoding='utf-8')
          PY

          grep -q "LESSON 2 / 3 • SETUP" index.html
          grep -q "LESSON 3 / 3 • CLEAR & SCORE" index.html
          grep -q "Remove at least 75% of the arena" index.html
          grep -q "Dividers are setup tools and score 0" index.html
          ! grep -q "LESSON 2 / 3 • DIVIDER" index.html
          git diff --check

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/voidcut-tutorial-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/voidcut-tutorial-fix.yml
          git commit -m "Refine tutorial flow and explain scoring"
          git push origin HEAD:main
