name: VD2 ruler correction

on:
  pull_request:
    branches:
      - chatgpt/vd1-core-renderer-reconstruction
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-ruler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vd2-gameplay-hud-reconstruction
          fetch-depth: 0
      - name: Correct 0-100 field ruler scale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='ratio=Math.max(0,Math.min(1,cleared/target))'
          new='ratio=Math.max(0,Math.min(1,cleared/100))'
          if old in text:
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
              print('Corrected clear ruler to absolute field percentage.')
          elif new in text:
              print('Clear ruler already corrected.')
          else:
              raise SystemExit('Expected VD2 clear-ruler expression not found')
          PY
      - name: Validate script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if 'ratio=Math.max(0,Math.min(1,cleared/100))' not in text:
              raise SystemExit('Ruler correction missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/voidcut-inline.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/voidcut-inline.js
      - name: Commit correction
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "VD2: correct field-clear ruler scale"
          git push origin HEAD:chatgpt/vd2-gameplay-hud-reconstruction
