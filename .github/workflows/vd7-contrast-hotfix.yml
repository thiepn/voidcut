name: VD7 contrast threshold hotfix

on:
  push:
    branches:
      - chatgpt/vd7-theme-responsive-certification

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vd7-theme-responsive-certification
      - name: Tighten Plum on-accent contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/vd7_patch.py')
          t=p.read_text(encoding='utf-8')
          old="'--vc-on-accent: #FFF1E7;': '--vc-on-accent: #241620;',"
          new="'--vc-on-accent: #FFF1E7;': '--vc-on-accent: #23151F;',"
          if old in t:
            t=t.replace(old,new,1)
            p.write_text(t,encoding='utf-8')
          else:
            print('Plum contrast correction already present')
          PY
          if git diff --quiet -- design/vd7_patch.py; then
            echo "No contrast update needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/vd7_patch.py
          git commit -m "VD7: satisfy Plum contrast threshold"
          git push origin HEAD:chatgpt/vd7-theme-responsive-certification
