name: F17 viewport significance and input preservation

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f17-viewport-significance.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F17 viewport patch
        run: python3 leaderboard/scripts/f17-fix-viewport-significance.py

      - name: Validate service worker syntax
        run: node --check sw.js

      - name: Validate Worker syntax
        working-directory: leaderboard
        run: npm run check

      - name: Validate inline runtime syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw new Error('inline runtime script missing');
          for(const source of scripts)new Function(source);
          console.log('inline runtime syntax PASS');
          NODE

      - name: Run F1 replay timing regression
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Run F2 ranked pause regression
        working-directory: leaderboard
        run: node scripts/test-ranked-pause-source.mjs ../index.html

      - name: Run F3 ranked timing regression
        working-directory: leaderboard
        run: node scripts/test-ranked-timing-source.mjs

      - name: Run F4 replay resource regression
        working-directory: leaderboard
        run: node scripts/test-replay-resource-limits-source.mjs ../index.html

      - name: Run F5 replay hash regression
        working-directory: leaderboard
        run: node scripts/test-replay-hash-normalization-source.mjs

      - name: Run F6 anonymous rate-limit regression
        working-directory: leaderboard
        run: node scripts/test-anonymous-rate-limit-source.mjs

      - name: Run F7 Turnstile contract regression
        working-directory: leaderboard
        run: node scripts/test-turnstile-contract-source.mjs

      - name: Run F8 ranked start regression
        working-directory: leaderboard
        run: node scripts/test-ranked-start-ticket-source.mjs

      - name: Run F9 persistent queue regression
        working-directory: leaderboard
        run: node scripts/test-persistent-submission-queue-source.mjs

      - name: Run F10 identity durability regression
        working-directory: leaderboard
        run: node scripts/test-leaderboard-identity-durability-source.mjs

      - name: Run F11 ranking consistency regression
        working-directory: leaderboard
        run: node scripts/test-leaderboard-ranking-source.mjs

      - name: Run F12 backend maintenance regression
        working-directory: leaderboard
        run: python3 scripts/test-backend-maintenance-source.py

      - name: Run F13 Worker error-boundary regression
        working-directory: leaderboard
        run: node scripts/test-worker-route-error-boundary-source.mjs

      - name: Run F14 navigation shell cache regression
        working-directory: leaderboard
        run: node scripts/test-service-worker-navigation-cache-source.mjs

      - name: Run F15 PWA update lifecycle regression
        working-directory: leaderboard
        run: node scripts/test-pwa-update-lifecycle-source.mjs

      - name: Run F16 PWA cache freshness regression
        working-directory: leaderboard
        run: node scripts/test-pwa-cache-freshness-source.mjs

      - name: Run F17 viewport significance regression
        working-directory: leaderboard
        run: node scripts/test-viewport-significance-source.mjs

      - name: Mark F17 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-020 | MEDIUM | `visualViewport` resize/scroll handling cancels gestures and resets timing before determining whether the change is significant. | F17 | FIXED — VERIFYING |'
          new='| VC-020 | MEDIUM | `visualViewport` resize/scroll handling cancels gestures and resets timing before determining whether the change is significant. | F17 | FIXED — F17 PASS |'
          if s.count(old)!=1:
              raise SystemExit('F17 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F17 verification evidence\n\n- Insignificant viewport changes (<12% width/height delta, no orientation change, not forced) still update viewport geometry/state but do not call ranked timing-reset accounting, do not cancel the active pointer/aim, do not reset `acc`, `visualBudget`, or `last`, and do not pause play/replay.\n- Significant viewport changes retain the prior protective behavior: `DISPLAY CHANGED` timing accounting, pointer cancellation, accumulator/frame-timestamp reset, gameplay pause/unranking, or replay pause.\n- Forced orientation-change handling remains significant even when the measured dimension delta is tiny.\n- Permanent regression executes the extracted production `settleViewport()` function against insignificant, significant, forced, and replay fixtures.\n- F3's regression now asserts viewport timing-reset accounting in the significant branch, preserving ranked timing integrity without charging harmless visual-viewport jitter.\n- Service-worker, Worker and inline runtime syntax pass, and permanent F1-F17 regressions are green.\n\n**F17 disposition: PASS. VC-020 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F17 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-ranked-timing-source.mjs leaderboard/scripts/test-viewport-significance-source.mjs
          git diff --cached --check
          git commit -m 'F17: gate viewport resets by significance'
          git push origin HEAD:fix/v6.2-hardening

# rerun after correcting executable regression harness scope
