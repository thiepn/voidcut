name: VOIDCUT v6 layout hotfix certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify-layout-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Static hotfix contract
        run: |
          test "$(git rev-parse HEAD:index.html)" = "8a8d8f2c21145cf9a53172e6bb1a900eae97b170"
          grep -q 'V6 POST-RELEASE LAYOUT HOTFIX' design/voidcut-design-system.css
          grep -q "VOIDCUT_CACHE_VERSION = '6.0.0-pwa2'" sw.js
          node --check sw.js

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render reported regressions
        run: |
          python3 -m http.server 4173 >/tmp/voidcut-hotfix-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > v6-layout-check.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const viewports=[
            ['reported-game',565,974],
            ['phone-small',360,640],
            ['phone',390,844],
            ['tablet',768,1024],
            ['reported-records',1269,838],
            ['desktop',1440,900]
          ];
          const failures=[];
          for(const [name,width,height] of viewports){
            const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
            const page=await context.newPage();
            const runtime=[];
            page.on('pageerror',e=>runtime.push(`pageerror ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')runtime.push(`console ${m.text()}`)});
            page.on('requestfailed',r=>runtime.push(`request ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.VoidcutDesign&&document.querySelector('#recordsPanel > .screen-nav'));

            const pause=await page.evaluate(()=>{
              const wrap=document.getElementById('wrap').getBoundingClientRect();
              const canvas=document.getElementById('game').getBoundingClientRect();
              const b=document.getElementById('pauseBtn');
              b.style.display='block';
              const r=b.getBoundingClientRect(),s=getComputedStyle(b),scale=canvas.width/720;
              const scoreSectionRight=canvas.left+258*scale;
              const bg=s.backgroundColor;
              const transparent=bg==='transparent'||bg==='rgba(0, 0, 0, 0)';
              return {
                left:r.left,right:r.right,top:r.top,width:r.width,height:r.height,
                wrapTop:wrap.top,wrapCenter:wrap.left+wrap.width/2,
                center:r.left+r.width/2,scoreSectionRight,transparent,
                border:parseFloat(s.borderTopWidth)||0,shadow:s.boxShadow
              };
            });
            if(pause.width<43.9||pause.height<43.9)failures.push(`${name}: pause target ${pause.width}x${pause.height}`);
            if(Math.abs(pause.center-pause.wrapCenter)>1.5)failures.push(`${name}: pause not centered in top strip`);
            if(Math.abs(pause.top-pause.wrapTop)>1.5)failures.push(`${name}: pause top ${pause.top} vs wrap ${pause.wrapTop}`);
            if(pause.left<=pause.scoreSectionRight)failures.push(`${name}: pause hit target intersects score section`);
            if(!pause.transparent||pause.border>0||pause.shadow!=='none')failures.push(`${name}: pause still has opaque/decorative covering surface`);

            const records=await page.evaluate(()=>{
              document.querySelectorAll('.overlay').forEach(x=>x.classList.add('hidden'));
              const panel=document.getElementById('recordsPanel'); panel.classList.remove('hidden');
              const nav=panel.querySelector(':scope > .screen-nav'),back=document.getElementById('recordsBack');
              const nr=nav.getBoundingClientRect(),br=back.getBoundingClientRect();
              return {navLeft:nr.left,backLeft:br.left,backWidth:br.width,overflow:panel.scrollWidth>panel.clientWidth+1,parent:back.parentElement?.className||''};
            });
            if(!records.parent.includes('screen-nav'))failures.push(`${name}: Records Back not in screen-nav`);
            if(Math.abs(records.backLeft-records.navLeft)>2)failures.push(`${name}: Records Back misaligned ${records.backLeft} vs ${records.navLeft}`);
            if(records.backWidth<100||records.backWidth>150)failures.push(`${name}: Records Back width ${records.backWidth}`);
            if(records.overflow)failures.push(`${name}: Records horizontal overflow`);
            if(runtime.length)failures.push(`${name}: runtime ${runtime.join(' | ')}`);
            await context.close();
          }
          await browser.close();
          console.log(`Rendered regression assertions: ${viewports.length*2}`);
          if(failures.length){for(const f of failures)console.error('- '+f);process.exit(1)}
          console.log('VOIDCUT V6 LAYOUT HOTFIX CERTIFICATION PASS');
          JS
          node v6-layout-check.mjs
          rm -f v6-layout-check.mjs
