name: Diagnose VOIDCUT Cloudflare deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-voidcut-cloudflare.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: leaderboard
        run: npm install --no-audit --no-fund
      - name: Identify Cloudflare account and deployment
        working-directory: leaderboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo '=== WRANGLER WHOAMI ==='
          npx wrangler whoami
          echo '=== DEPLOYMENTS ==='
          npx wrangler deployments list || true
          echo '=== VERSIONS ==='
          npx wrangler versions list || true
          echo '=== PUBLIC ENDPOINT ==='
          curl -i -sS --max-time 15 https://voidcut-leaderboard.thiepn.workers.dev/health || true
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-voidcut-cloudflare.yml
          git commit -m "Remove Cloudflare deployment diagnostic"
          git push
