name: F21 finalize cross-browser certification

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f21-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize F21 register
        run: python3 .github/scripts/f21-finalize-register.py

      - name: Recheck F21 persistent suite contract
        working-directory: leaderboard
        run: node scripts/test-cross-browser-release-suite-source.mjs

      - name: Commit F21 certification record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/V6_2_HARDENING_FIX_REGISTER.md
          git diff --cached --check
          git commit -m 'F21: record cross-browser certification pass'
          git push origin HEAD:fix/v6.2-hardening
