name: VOIDCUT PWA release gate

on:
  push:
    branches:
      - chatgpt/release-pwa-hardening

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/release-pwa-hardening
          fetch-depth: 0

      - name: Static package certification
        run: |
          python3 design/pwa_static_check.py
          node --check sw.js
          test "$(git rev-parse HEAD:index.html)" = "8a8d8f2c21145cf9a53172e6bb1a900eae97b170"
          test "$(git rev-parse HEAD:design/voidcut-design-system.css)" = "29456237edb9fb2a3cefd30157bc5729a3ffed04"
          echo "VD7 certified product blobs unchanged"

      - name: Install Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser / offline / update certification
        run: |
          python3 -m http.server 4173 >/tmp/voidcut-pwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node design/pwa_browser_certify.mjs

      - name: Record certification pass
        run: |
          cat > design/RELEASE_PWA_STATUS.md <<'EOF'
          # VOIDCUT Release / PWA Hardening Status

          **COMPLETE — PWA RELEASE CERTIFICATION PASS**

          The automated release gate passed the static package, Chromium service-worker, installability/manifest, offline reload and explicit-update lifecycle checks.

          Certified package behavior:

          - all root manifest/icon/service-worker assets exist;
          - PNG install icons are 192×192, 512×512 and 512×512 maskable;
          - complete runtime shell precache installs successfully;
          - a controlled reload has an activated service-worker controller;
          - offline reload boots VOIDCUT from the release cache;
          - a second worker revision installs into a separate cache and waits;
          - `SKIP_WAITING` activates that revision and removes the obsolete VOIDCUT cache;
          - unrelated cache namespaces are not targeted;
          - the VD7-certified `index.html` and design-system CSS blobs are unchanged;
          - release contracts remain build 6.0.0, save 16, replay 8, arena 2, director 6, daily 1.

          Cache version certified: `6.0.0-pwa1`.
          EOF
          if git diff --quiet -- design/RELEASE_PWA_STATUS.md; then
            echo "Certification status already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/RELEASE_PWA_STATUS.md
          git commit -m "Release hardening: record PWA certification pass"
          git push origin HEAD:chatgpt/release-pwa-hardening
