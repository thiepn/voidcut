name: VD7 apply browser review patch

on:
  push:
    branches:
      - chatgpt/vd7-theme-responsive-certification

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vd7-theme-responsive-certification
          fetch-depth: 0
      - name: Apply VD7 base and browser review corrections
        run: |
          python3 design/vd7_patch.py
          python3 design/vd7_browser_review_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert 'VD7 BROWSER REVIEW CORRECTIONS' in h
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          Path('/tmp/vd7-inline.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('VD7 reviewed HTML bytes:',len(h.encode('utf-8')))
          PY
          node --check /tmp/vd7-inline.js
      - name: Commit reviewed product files
        run: |
          if git diff --quiet -- index.html design/voidcut-design-system.css; then
            echo "VD7 product files already reviewed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html design/voidcut-design-system.css
          git commit -m "VD7: apply rendered browser corrections"
          git push origin HEAD:chatgpt/vd7-theme-responsive-certification
