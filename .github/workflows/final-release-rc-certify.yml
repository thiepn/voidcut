name: VOIDCUT final release RC certification

on:
  push:
    branches:
      - chatgpt/v6-final-release-candidate

permissions:
  contents: write

jobs:
  certify-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out integrated RC
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v6-final-release-candidate
          fetch-depth: 0

      - name: Verify integration topology and release source
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          for sha in \
            720a11abc69de44763a60ccbb74041255b56771e \
            309c9c8d51eaed3ce93d57909a97ad1736818d30 \
            796b189ba0a7c80ecce27ba312c805a7e62c4cab \
            53e37dc4d15aed54b20810710ab561c02de1e680 \
            f0236326d1e2141349334cd9cb700f896d2884e5 \
            07099dbfb1f9a98fd3e24d452d3dc2a54b1c63f9 \
            730bb9d4a30c4e28708a07320af44f505ad45fa9 \
            4c9071a3624171a9ee0eb5a1021174e2371cad86 \
            355895dd0b467378571dadb94c27549267e113e7
          do
            git merge-base --is-ancestor "$sha" HEAD || { echo "Missing certified ancestor $sha"; exit 1; }
          done
          test "$(git rev-parse HEAD:index.html)" = "8a8d8f2c21145cf9a53172e6bb1a900eae97b170"
          test "$(git rev-parse HEAD:design/voidcut-design-system.css)" = "29456237edb9fb2a3cefd30157bc5729a3ffed04"
          echo "Integrated history and certified product blobs PASS"

      - name: Static release certification
        run: |
          python3 design/rc_static_check.py
          node --check /tmp/voidcut-rc-inline.js
          node --check design/voidcut-design-system.js
          node --check sw.js

      - name: Prepare root and project-path deployment replicas
        run: |
          rm -rf /tmp/voidcut-root /tmp/voidcut-project
          mkdir -p /tmp/voidcut-root /tmp/voidcut-project/voidcut
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/voidcut-root/
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/voidcut-project/voidcut/
          test -f /tmp/voidcut-root/index.html
          test -f /tmp/voidcut-project/voidcut/index.html

      - name: Install cross-engine browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Browser, save-upgrade and deployment certification
        run: |
          python3 -m http.server 4173 --directory /tmp/voidcut-root >/tmp/voidcut-root-http.log 2>&1 &
          ROOT_PID=$!
          python3 -m http.server 4174 --directory /tmp/voidcut-project >/tmp/voidcut-project-http.log 2>&1 &
          PROJECT_PID=$!
          trap 'kill $ROOT_PID $PROJECT_PID || true' EXIT
          sleep 1
          node design/rc_browser_certify.mjs

      - name: Record final RC certification
        run: |
          cat > design/FINAL_RELEASE_RC.md <<'EOF'
          # VOIDCUT v6.0.0 — Final Release Integration & Deployment Certification

          ## Status

          **V6_RC_CERTIFIED — RELEASE / DEPLOYMENT PACKAGE READY**

          The complete VD0 → VD7 → PWA chain has been integrated into one release-candidate branch targeting `main` and passed the final automated certification gate.

          This status means the repository release candidate is certified for merge/deployment. It does **not** claim that production has already been deployed; no merge into `main` or live-site publication was performed by this phase.

          ## Integration topology

          The final RC contains, as Git ancestors, the certified heads for:

          - VD0 visual infrastructure
          - VD1 core renderer
          - VD2 gameplay HUD
          - VD3 product shell
          - VD4 secondary screens
          - VD5 cosmetics
          - VD6 utilities
          - VD7 theme/responsive certification
          - Release/PWA hardening

          `main` is an ancestor of the RC, and the RC is a single forward integration history rather than a synthetic rewrite.

          ## Certified release contracts

          | Contract | Version |
          | --- | ---: |
          | Build | 6.0.0 |
          | Save | 16 |
          | Replay | 8 |
          | Arena | 2 |
          | Director | 6 |
          | Daily | 1 |
          | PWA cache | 6.0.0-pwa1 |

          ## Source-integrity certification

          - no merge-conflict markers in active product sources;
          - all required runtime/PWA assets present;
          - HTML parses with no duplicate IDs;
          - complete inline game script passes `node --check`;
          - design-system JavaScript passes `node --check`;
          - service worker passes `node --check`;
          - manifest, icon dimensions, scope/start URL and precache assets validated;
          - VD7-certified `index.html` blob preserved exactly as `8a8d8f2c21145cf9a53172e6bb1a900eae97b170`;
          - VD7-certified design-system CSS blob preserved exactly as `29456237edb9fb2a3cefd30157bc5729a3ffed04`.

          ## Cross-engine smoke certification

          Automated headless boot checks passed on:

          - Chromium
          - Firefox
          - Playwright WebKit

          Each engine was exercised at desktop 1440×900 and mobile 390×844 in both deployment forms:

          - custom-domain/root-style `/`
          - GitHub-Pages-style `/voidcut/`

          The gate rejected page exceptions, console errors, request failures, same-origin HTTP 4xx/5xx, invisible menu boot, horizontal overflow, theme-suite failure and undersized visible controls.

          Playwright WebKit is an engine-level Safari-adjacent smoke test, not a claim of physical iOS/macOS Safari device certification.

          ## Save migration certification

          Representative legacy raw saves from schemas **1, 8 and 15** were loaded before application startup.

          For each fixture the game:

          - accepted the old raw save;
          - normalized it to schema 16;
          - repaired it into the current integrity envelope (`f:2`, `v:16`);
          - preserved best score, deepest chamber, total runs, lifetime cuts, record values, settings and valid cosmetics;
          - recorded the source schema in `system.migrationFromSchema`.

          ## Runtime / deterministic certification

          The final Chromium lifecycle pass reran VOIDCUT's built-in `6.0.0 RELEASE AUDIT` and required **PASS**. It also ran System Checks and rejected any `RESULT: FAIL` state.

          The built-in audit covers deterministic simulation, generated chambers, same-seed stability, save-envelope round trip, replay contracts, Daily seeds, tutorial geometry, Mastery/Cosmetics IDs and PWA asset probing.

          ## PWA lifecycle certification

          Both `/` and `/voidcut/` deployment replicas passed:

          - fresh online boot;
          - valid schema-16 primary save creation;
          - service-worker installation and controlled reload;
          - manifest/installability inspection in Chromium;
          - offline reload from the precached shell;
          - second-worker installation into a separate release cache;
          - waiting-worker behavior without silent activation;
          - explicit `SKIP_WAITING` activation;
          - `controllerchange`;
          - obsolete VOIDCUT cache removal;
          - service-worker unregister/cache removal;
          - clean service-worker reinstall with existing save retained.

          ## Deployment-path certification

          The package is path-relative and passed both a root deployment and a nested `/voidcut/` deployment. This protects the same build against the two common hosting forms used by a custom domain and project-path static hosting.

          ## Release notes — v6.0.0 visual reconstruction

          v6.0.0's certified release candidate includes the complete CUTFORM reconstruction: semantic theme infrastructure, physical playfield rendering, reconstructed gameplay HUD, editorial menu/pause/results shell, Records/Competition/Mastery redesign, material-based Cosmetics, system/manual Settings and Diagnostics, Replay instrumentation, six-theme certification, responsive hardening, and complete offline/installable PWA packaging.

          Gameplay contracts remain intentionally stable: this release certification does not change deterministic simulation, scoring, balance, progression, save/replay formats or generation rules.

          ## Production deployment checklist

          The RC is ready for the deployment action, but production remains intentionally untouched until authorized:

          1. merge the final RC PR into `main`;
          2. allow the configured static host/GitHub Pages deployment to publish the new head;
          3. verify the live URL returns 200 for `index.html`, manifest, `sw.js`, all three PNG icons, `icon.svg`, and both design-system files;
          4. confirm the live service worker scope matches the deployed path and cache `voidcut-shell-6.0.0-pwa1` becomes active;
          5. perform one physical-device iOS Safari launch/install smoke and, where relevant, one installed desktop browser smoke; automated WebKit/Chromium engine checks do not replace hardware-specific shell behavior;
          6. keep `VOIDCUT_CACHE_VERSION` synchronized with every future change to a precached runtime asset.

          ## Certification result

          **FINAL RC: PASS — V6_RC_CERTIFIED**
          EOF
          if git diff --quiet -- design/FINAL_RELEASE_RC.md; then
            echo "Final certification record already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/FINAL_RELEASE_RC.md
          git commit -m "RC: record final release certification pass [skip ci]"
          git push origin HEAD:chatgpt/v6-final-release-candidate
