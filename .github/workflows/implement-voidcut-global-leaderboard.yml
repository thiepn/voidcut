# retry after semantic browser-global validation
name: Implement VOIDCUT global leaderboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-voidcut-global-leaderboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install leaderboard build dependencies
        working-directory: leaderboard
        run: npm install --no-audit --no-fund

      - name: Patch VOIDCUT to v6.1
        working-directory: leaderboard
        run: node scripts/patch-game.mjs

      - name: Validate game JavaScript and contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          main = max(scripts, key=len)
          Path('/tmp/voidcut-v61.js').write_text(main, encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', s)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              raise SystemExit('Duplicate DOM IDs: ' + ', '.join(dup))
          required = [
              "voidcut-build\" content=\"6.1.0",
              "voidcut-save-schema\" content=\"17",
              "voidcut-replay-version\" content=\"9",
              "function gradeBonus(chamber,grade)",
              "replayScoringVersion",
              "GLOBAL LEADERBOARD",
              "voidcut-api.thiepn.dev",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing v6.1 contracts: ' + ', '.join(missing))
          print('VOIDCUT v6.1 static contract PASS')
          PY
          node --check /tmp/voidcut-v61.js
          grep -q "6.1.0-pwa1" sw.js

      - name: Generate exact server replay verifier
        working-directory: leaderboard
        run: |
          npm run build:verifier
          node --check src/generated-verifier.js
          grep -q "function gradeBonus" src/generated-verifier.js
          grep -q "class Sim" src/generated-verifier.js
          grep -q "export function verifyReplay" src/generated-verifier.js

      - name: Validate Worker bundle
        working-directory: leaderboard
        run: npx wrangler deploy --dry-run --outdir /tmp/voidcut-worker-build

      - name: Commit v6.1 frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-voidcut-global-leaderboard.yml
          git add index.html sw.js
          git commit -m "Implement VOIDCUT global leaderboard scoring"
          git push
