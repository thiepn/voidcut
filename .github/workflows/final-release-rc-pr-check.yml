name: VOIDCUT RC observable PR certification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify-rc-observable:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6-final-release-candidate
          fetch-depth: 0
      - name: Integration + static gate
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          for sha in 720a11abc69de44763a60ccbb74041255b56771e 309c9c8d51eaed3ce93d57909a97ad1736818d30 796b189ba0a7c80ecce27ba312c805a7e62c4cab 53e37dc4d15aed54b20810710ab561c02de1e680 f0236326d1e2141349334cd9cb700f896d2884e5 07099dbfb1f9a98fd3e24d452d3dc2a54b1c63f9 730bb9d4a30c4e28708a07320af44f505ad45fa9 4c9071a3624171a9ee0eb5a1021174e2371cad86 355895dd0b467378571dadb94c27549267e113e7; do git merge-base --is-ancestor "$sha" HEAD; done
          test "$(git rev-parse HEAD:index.html)" = "8a8d8f2c21145cf9a53172e6bb1a900eae97b170"
          test "$(git rev-parse HEAD:design/voidcut-design-system.css)" = "29456237edb9fb2a3cefd30157bc5729a3ffed04"
          python3 design/rc_static_check.py
          node --check /tmp/voidcut-rc-inline.js
          node --check design/voidcut-design-system.js
          node --check sw.js
      - name: Prepare deployment replicas
        run: |
          rm -rf /tmp/voidcut-root /tmp/voidcut-project
          mkdir -p /tmp/voidcut-root /tmp/voidcut-project/voidcut
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/voidcut-root/
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/voidcut-project/voidcut/
      - name: Install browser engines
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run final browser certification
        run: |
          python3 design/rc_firefox_notice_patch3.py
          python3 design/rc_firefox_runtime_filter.py
          node --check design/rc_browser_certify.mjs
          python3 -m http.server 4173 --directory /tmp/voidcut-root >/tmp/voidcut-root-http.log 2>&1 &
          ROOT_PID=$!
          python3 -m http.server 4174 --directory /tmp/voidcut-project >/tmp/voidcut-project-http.log 2>&1 &
          PROJECT_PID=$!
          trap 'kill $ROOT_PID $PROJECT_PID || true' EXIT
          sleep 1
          node design/rc_browser_certify.mjs
