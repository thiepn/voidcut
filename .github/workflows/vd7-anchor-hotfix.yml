name: VD7 patch anchor hotfix

on:
  push:
    branches:
      - chatgpt/vd7-theme-responsive-certification

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vd7-theme-responsive-certification
      - name: Correct VD6 startup anchor in VD7 migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/vd7_patch.py')
          t=p.read_text(encoding='utf-8')
          old="startup = 'rebuildRenderGeometry();viewportState=fitViewport();applyUiProductionPolish();renderToggles();applyAccessibilityClasses();renderCosmetics();showMenu();refreshInstall();refreshFullscreen();requestAnimationFrame(update);'"
          new="startup = 'rebuildRenderGeometry();viewportState=fitViewport();applyUiProductionPolish();renderToggles();applyAccessibilityClasses();vd6InitUtilityLayer();renderCosmetics();showMenu();refreshInstall();refreshFullscreen();requestAnimationFrame(update);'"
          old2="startup_new = 'rebuildRenderGeometry();viewportState=fitViewport();applyUiProductionPolish();vd7Initialize();renderToggles();applyAccessibilityClasses();renderCosmetics();showMenu();refreshInstall();refreshFullscreen();requestAnimationFrame(update);'"
          new2="startup_new = 'rebuildRenderGeometry();viewportState=fitViewport();applyUiProductionPolish();vd7Initialize();renderToggles();applyAccessibilityClasses();vd6InitUtilityLayer();renderCosmetics();showMenu();refreshInstall();refreshFullscreen();requestAnimationFrame(update);'"
          changed=False
          if old in t:
            t=t.replace(old,new,1);changed=True
          if old2 in t:
            t=t.replace(old2,new2,1);changed=True
          if not changed:
            print('VD7 startup anchor already corrected')
          p.write_text(t,encoding='utf-8')
          PY
          if git diff --quiet -- design/vd7_patch.py; then
            echo "No anchor update needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/vd7_patch.py
          git commit -m "VD7: correct certification patch anchor"
          git push origin HEAD:chatgpt/vd7-theme-responsive-certification
