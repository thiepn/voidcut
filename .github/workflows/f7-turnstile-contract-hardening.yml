name: F7 Turnstile contract hardening

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f7-turnstile-contract-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F7 Turnstile contract patch
        run: python3 leaderboard/scripts/f7-remove-incomplete-turnstile.py

      - name: Validate Worker syntax
        working-directory: leaderboard
        run: npm run check

      - name: Run F1 replay timing regression
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Run F2 ranked pause regression
        working-directory: leaderboard
        run: node scripts/test-ranked-pause-source.mjs ../index.html

      - name: Run F3 ranked timing regression
        working-directory: leaderboard
        run: node scripts/test-ranked-timing-source.mjs ../index.html

      - name: Run F4 replay resource regression
        working-directory: leaderboard
        run: node scripts/test-replay-resource-limits-source.mjs ../index.html

      - name: Run F5 replay hash regression
        working-directory: leaderboard
        run: node scripts/test-replay-hash-normalization-source.mjs

      - name: Run F6 anonymous rate-limit regression
        working-directory: leaderboard
        run: node scripts/test-anonymous-rate-limit-source.mjs

      - name: Run F7 Turnstile contract regression
        working-directory: leaderboard
        run: node scripts/test-turnstile-contract-source.mjs

      - name: Mark F7 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-007 | HIGH | Turnstile backend enforcement is implemented without matching client token acquisition/submission. | F7 | FIXED — VERIFYING |'
          new='| VC-007 | HIGH | Turnstile backend enforcement is implemented without matching client token acquisition/submission. | F7 | FIXED — F7 PASS |'
          if s.count(old)!=1:
              raise SystemExit('VC-007 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F7 verification evidence\n\n- Worker contains no dormant Turnstile helper, environment switch, secret lookup, token field, siteverify URL or `human-check-failed` response path.\n- Shipped client and source client remain consistent: profile creation sends only the public name and contains no partial Turnstile widget/token integration.\n- Profile creation still enforces F6 anonymous network rate limiting, name validation, opaque token creation/hash storage and D1 persistence.\n- PROFILE/RUN/SUBMIT Cloudflare limiter quotas remain unchanged.\n- Worker syntax and permanent F1-F6 regressions remain green.\n\n**F7 disposition: PASS. VC-007 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F7 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f leaderboard/src/index.js design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-turnstile-contract-source.mjs
          git diff --cached --check
          git commit -m 'F7: remove incomplete Turnstile gate'
          git push origin HEAD:fix/v6.2-hardening
