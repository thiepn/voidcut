name: F13 Worker route error boundary

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f13-worker-error-boundary.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F13 route boundary patch
        run: python3 leaderboard/scripts/f13-fix-route-error-boundary.py

      - name: Validate Worker syntax
        working-directory: leaderboard
        run: npm run check

      - name: Validate inline runtime syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw new Error('inline runtime script missing');
          for(const source of scripts)new Function(source);
          console.log('inline runtime syntax PASS');
          NODE

      - name: Run F1 replay timing regression
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Run F2 ranked pause regression
        working-directory: leaderboard
        run: node scripts/test-ranked-pause-source.mjs ../index.html

      - name: Run F3 ranked timing regression
        working-directory: leaderboard
        run: node scripts/test-ranked-timing-source.mjs

      - name: Run F4 replay resource regression
        working-directory: leaderboard
        run: node scripts/test-replay-resource-limits-source.mjs ../index.html

      - name: Run F5 replay hash regression
        working-directory: leaderboard
        run: node scripts/test-replay-hash-normalization-source.mjs

      - name: Run F6 anonymous rate-limit regression
        working-directory: leaderboard
        run: node scripts/test-anonymous-rate-limit-source.mjs

      - name: Run F7 Turnstile contract regression
        working-directory: leaderboard
        run: node scripts/test-turnstile-contract-source.mjs

      - name: Run F8 ranked start regression
        working-directory: leaderboard
        run: node scripts/test-ranked-start-ticket-source.mjs

      - name: Run F9 persistent queue regression
        working-directory: leaderboard
        run: node scripts/test-persistent-submission-queue-source.mjs

      - name: Run F10 identity durability regression
        working-directory: leaderboard
        run: node scripts/test-leaderboard-identity-durability-source.mjs

      - name: Run F11 ranking consistency regression
        working-directory: leaderboard
        run: node scripts/test-leaderboard-ranking-source.mjs

      - name: Run F12 backend maintenance regression
        working-directory: leaderboard
        run: python3 scripts/test-backend-maintenance-source.py

      - name: Run F13 Worker error-boundary regression
        working-directory: leaderboard
        run: node scripts/test-worker-route-error-boundary-source.mjs

      - name: Mark F13 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-015 | MEDIUM | Top-level Worker route try/catch does not await async route handlers consistently, weakening controlled error handling. | F13 | FIXED — VERIFYING |'
          new='| VC-015 | MEDIUM | Top-level Worker route try/catch does not await async route handlers consistently, weakening controlled error handling. | F13 | FIXED — F13 PASS |'
          if s.count(old)!=1:
              raise SystemExit('F13 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F13 verification evidence\n\n- All five async top-level route handlers are declared async and are dispatched with `return await` from inside the Worker fetch try/catch.\n- No bare top-level returns remain for profile creation, run start, submission forwarding, leaderboard retrieval or replay retrieval.\n- A regression harness demonstrates the language-level distinction directly: a rejecting async handler is caught with `return await` and escapes with a bare `return`.\n- The controlled catch still logs the Worker error and returns the existing 500 `server-error` response.\n- F12 scheduled maintenance retains its own awaited try/catch boundary.\n- Worker and inline runtime syntax pass, and permanent F1-F12 regressions remain green.\n\n**F13 disposition: PASS. VC-015 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F13 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f leaderboard/src/index.js design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-worker-route-error-boundary-source.mjs
          git diff --cached --check
          git commit -m 'F13: contain async Worker route failures'
          git push origin HEAD:fix/v6.2-hardening
