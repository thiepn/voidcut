name: VD7 visual final certification

on:
  pull_request:
    branches:
      - chatgpt/vd6-system-utility-reconstruction

jobs:
  visual-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vd7-theme-responsive-certification
      - name: Verify final VD7 source state
        run: |
          grep -q 'content="VD7"' index.html
          grep -q 'VD7 BROWSER REVIEW CORRECTIONS II' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          Path('/tmp/vd7-final.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/vd7-final.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify final visual matrix
        run: |
          python3 -m http.server 4173 >/tmp/vd7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > vd7-final.mjs <<'JS'
          import { chromium } from 'playwright';
          const V=[['PHONE-S',360,640],['PHONE-M',390,844],['PHONE-L',412,915],['TABLET-P',768,1024],['TABLET-L',820,1180],['DESKTOP-720',1280,720],['DESKTOP-900',1440,900],['DESKTOP-FHD',1920,1080],['DESKTOP-QHD',2560,1440],['ULTRAWIDE',3440,1440]];
          const T=['paper','carbon','cobalt','kelp','plum','mono'];
          const S=['menu','recordsPanel','competitionPanel','masteryPanel','cosmeticsPanel','settingsPanel','diagnosticsPanel','pausePanel','result','replayHud'];
          const OLD=['rgb(45, 226, 255)','rgba(45, 226, 255','rgb(255, 45, 158)','rgba(255, 45, 158'];
          const KNOWN_PACKAGING='A bad HTTP response code (404) was received when fetching the script.';
          const b=await chromium.launch({headless:true});const failures=[];let checks=0,knownPackaging=0;
          for(const [vn,w,h] of V){
            const cx=await b.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});const p=await cx.newPage();const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            p.on('console',m=>{if(m.type()!=='error')return;const x=m.text();if(x===KNOWN_PACKAGING){knownPackaging++;return}errors.push(x)});
            await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.VoidcutCertification&&window.VoidcutDesign);await p.waitForTimeout(60);
            async function inspect(theme,screen){
              const r=await p.evaluate(({theme,screen,OLD})=>{
                window.VoidcutDesign.applyTheme(theme,{persist:false});window.VoidcutCertification.syncThemeColor();
                document.querySelectorAll('.overlay').forEach(x=>x.classList.add('hidden'));document.getElementById('menu')?.classList.add('hidden');document.getElementById('replayHud')?.classList.add('hidden');
                const target=document.getElementById(screen);target?.classList.remove('hidden');if(screen==='replayHud')document.getElementById('wrap')?.style.setProperty('display','block');
                const audit=window.VoidcutCertification.audit(),root=document.documentElement,leaks=[];
                if(target){const els=[target,...target.querySelectorAll('*')].filter(el=>{const s=getComputedStyle(el),q=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&q.width>0&&q.height>0}).slice(0,1000);const props=['color','backgroundColor','backgroundImage','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor','boxShadow','textShadow','filter','outlineColor'];for(const el of els){for(const pseudo of [null,'::before','::after']){const s=getComputedStyle(el,pseudo),txt=props.map(k=>s[k]||'').join('|');if(OLD.some(x=>txt.includes(x))){leaks.push(`${el.tagName}#${el.id} ${pseudo||'self'}`);break}}if(leaks.length>=4)break}}
                return{audit,overflow:!!target&&target.scrollWidth>target.clientWidth+1,rootOverflow:root.scrollWidth>innerWidth+1,bodyOverflow:document.body.scrollWidth>innerWidth+1,leaks};
              },{theme,screen,OLD});checks++;const k=`${vn}/${theme}/${screen}`;
              if(r.rootOverflow||r.bodyOverflow||r.overflow)failures.push(`${k}: horizontal overflow`);
              if(r.audit.touchFailures.length)failures.push(`${k}: touch target ${JSON.stringify(r.audit.touchFailures.slice(0,3))}`);
              if(!r.audit.themeSuite)failures.push(`${k}: contrast`);
              if(!r.audit.themeColorSynced)failures.push(`${k}: theme-color`);
              if(r.leaks.length)failures.push(`${k}: legacy color ${r.leaks.join(',')}`);
            }
            for(const t of T)await inspect(t,'menu');for(const s of S.slice(1))await inspect('paper',s);if(errors.length)failures.push(`${vn}: runtime ${JSON.stringify(errors)}`);await cx.close();
          }
          await b.close();console.log(`VD7 visual checks: ${checks}`);console.log(`Known out-of-scope packaging notices: ${knownPackaging}`);
          if(failures.length){for(const f of failures.slice(0,100))console.error('- '+f);process.exit(1)}
          console.log('VD7 FINAL VISUAL CERTIFICATION PASS');
          JS
          node vd7-final.mjs
