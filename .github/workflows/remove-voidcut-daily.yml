name: Remove VOIDCUT Daily system

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove residual Daily references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<span><small>DAILY</small><b>1</b></span>', ''),
              ("||id==='daily'", ''),
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Residual Daily reference expected once, found {n}: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Residual Daily references removed')
          PY

      - name: Remove Daily product system
        run: python3 .github/remove_voidcut_daily.py

      - name: Validate HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/voidcut-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', s)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              raise SystemExit('Duplicate DOM ids: ' + ', '.join(dup))
          if re.search(r'<button[^>]+id="daily"', s, re.I):
              raise SystemExit('Daily UI still present')
          live = s[s.index('</style>'):]
          if re.search(r'daily', live, re.I):
              raise SystemExit('Live Daily HTML/JS reference remains')
          print(f'HTML validation PASS: {len(ids)} ids; {len(s)} chars')
          PY
          node --check /tmp/voidcut-inline.js
          node --check sw.js

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-voidcut-daily.yml .github/remove_voidcut_daily.py
          git add index.html sw.js
          git commit -m "Remove Daily system from VOIDCUT"
          git push
