name: VD3 product shell bootstrap

on:
  pull_request:
    branches:
      - chatgpt/vd2-gameplay-hud-reconstruction
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out VD3 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vd3-product-shell-reconstruction
          fetch-depth: 0

      - name: Apply VD3 product shell migration
        run: |
          python3 design/vd3_patch.py
          python3 design/vd3_review_patch.py

      - name: Validate VD3 contract
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'name="voidcut-visual-phase" content="VD3"',
              "const VD3_SHELL_VERSION='VD3.0.0'",
              "Object.defineProperty(window,'VoidcutShell'",
              'class="vd3-menu-art"',
              'MAKE SPACE.',
              'physicalPause:true',
              'editorialResults:true',
              "const VD2_HUD_VERSION='VD2.0.0'",
              'drawCoreLightField(){return}',
              '#menu.hidden{display:none!important}',
              '@keyframes vd3ResultScore',
              '#pauseBtn{',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Missing VD3 tokens: ' + ', '.join(missing))
          if text.count('/* === VD3 CUTFORM PRODUCT SHELL') != 1:
              raise SystemExit('VD3 CSS marker must occur exactly once')
          if text.count('/* === VD3 REVIEW CORRECTIONS') != 1:
              raise SystemExit('VD3 review marker must occur exactly once')
          if text.count('// === VD3 PRODUCT SHELL CONTRACT') != 1:
              raise SystemExit('VD3 JS marker must occur exactly once')
          menu = text[text.index('<section id="menu"'):text.index('<section id="result"')]
          if 'hero-main-core' in menu or 'heroGlow' in menu or 'heroCut' in menu:
              raise SystemExit('Legacy neon menu hero still present')
          if 'PRECISION <span>•</span> RISK <span>•</span> VOID' in text:
              raise SystemExit('Legacy menu language still present')
          for name, expected in {
              'voidcut-build': '6.0.0',
              'voidcut-save-schema': '16',
              'voidcut-replay-version': '8',
              'voidcut-arena-generation': '2',
              'voidcut-director-generation': '6',
              'voidcut-daily-generation': '1',
          }.items():
              m = re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"', text)
              if not m or m.group(1) != expected:
                  raise SystemExit(f'Release contract changed for {name}: {m.group(1) if m else "missing"}')

          class Parser(HTMLParser):
              pass
          Parser().feed(text)
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          inline = max(scripts, key=len)
          Path('/tmp/voidcut-inline.js').write_text(inline, encoding='utf-8')
          print('VD3 static contract PASS')
          print('HTML bytes:', len(text.encode('utf-8')))
          print('Inline JS bytes:', len(inline.encode('utf-8')))
          PY
          node --check /tmp/voidcut-inline.js

      - name: Commit reconstructed shell
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains VD3 shell"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "VD3: finalize product shell"
          git push origin HEAD:chatgpt/vd3-product-shell-reconstruction
