name: F23 correct empty queue lifecycle assertion

on:
  push:
    branches:
      - fix/v6.2-hardening
    paths:
      - '.github/workflows/f23-empty-queue-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply F23 queue assertion correction
        run: python3 leaderboard/scripts/f23-fix-empty-queue.py
      - name: Validate F23 source contract
        working-directory: leaderboard
        run: node scripts/test-destructive-pwa-suite-source.mjs
      - name: Commit corrected permanent tests
        run: |
          rm leaderboard/scripts/f23-fix-empty-queue.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pwa-destructive.spec.mjs leaderboard/scripts/test-destructive-pwa-suite-source.mjs leaderboard/scripts/f23-fix-empty-queue.py
          git diff --cached --check
          git commit -m 'F23: assert empty queue after storage loss'
          git push origin HEAD:fix/v6.2-hardening
