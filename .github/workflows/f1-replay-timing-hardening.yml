name: F1 replay timing hardening

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f1-replay-timing-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F1 source patch
        run: python3 leaderboard/scripts/f1-harden-replay-timing.py

      - name: Validate inline runtime syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('No inline runtime found');
          const source=scripts.sort((a,b)=>b.length-a.length)[0];
          fs.writeFileSync('/tmp/voidcut-runtime.js',source);
          NODE
          node --check /tmp/voidcut-runtime.js

      - name: Run F1 source regression tests
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Install verifier build dependencies
        working-directory: leaderboard
        run: npm install --no-audit --no-fund

      - name: Regenerate deterministic server verifier
        working-directory: leaderboard
        run: |
          npm run build:verifier
          npm run check
          node --check src/generated-verifier.js
          grep -q 'function replayInputTiming' src/generated-verifier.js
          grep -q "invalidReason='stale-input'" src/generated-verifier.js
          grep -q 'idx===data.events.length' src/generated-verifier.js

      - name: Mark F1 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-001 | CRITICAL | Replay verifier treats timestamps as not-before times, allowing stale/queued cuts to execute later with zero input delay. | F1 | FIXED — VERIFYING |'
          new='| VC-001 | CRITICAL | Replay verifier treats timestamps as not-before times, allowing stale/queued cuts to execute later with zero input delay. | F1 | FIXED — F1 PASS |'
          if s.count(old)!=1:
              raise SystemExit('VC-001 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F1 verification evidence\n\n- Inline runtime JavaScript parses successfully after hardening.\n- Source-level timing regression tests pass for v9 due/stale/future classification.\n- Duplicate/effectively-duplicate v9 timestamps are rejected.\n- Legacy v8 duplicate timestamp validation remains backward-compatible.\n- Generated server verifier contains the same strict timing helper, stale-input rejection and all-events-consumed verification requirement.\n- Generated verifier and Worker source pass Node syntax checks.\n\n**F1 disposition: PASS. VC-001 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/src/generated-verifier.js
          git diff --cached --check
          git commit -m 'F1: enforce exact replay input timing'
          git push origin HEAD:fix/v6.2-hardening
