name: F3 ranked timing hardening

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f3-ranked-timing-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F3 source patch
        run: python3 leaderboard/scripts/f3-harden-ranked-timing.py

      - name: Validate inline runtime syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('No inline runtime found');
          fs.writeFileSync('/tmp/voidcut-runtime.js',scripts.sort((a,b)=>b.length-a.length)[0]);
          NODE
          node --check /tmp/voidcut-runtime.js

      - name: Run F1 replay timing regression
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Run F2 ranked pause regression
        working-directory: leaderboard
        run: node scripts/test-ranked-pause-source.mjs ../index.html

      - name: Run F3 ranked timing regression
        working-directory: leaderboard
        run: node scripts/test-ranked-timing-source.mjs ../index.html

      - name: Mark F3 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-003 | CRITICAL | Main-loop frame-gap clamping can create a slow-motion competitive advantage under throttling/stalls. | F3 | FIXED — VERIFYING |'
          new='| VC-003 | CRITICAL | Main-loop frame-gap clamping can create a slow-motion competitive advantage under throttling/stalls. | F3 | FIXED — F3 PASS |'
          if s.count(old)!=1:
              raise SystemExit('VC-003 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F3 verification evidence\n\n- Inline runtime JavaScript parses successfully after wall-clock integrity hardening.\n- Smooth 60 FPS-equivalent ranked timing remains eligible with zero discarded-time debit.\n- A moderate isolated frame stutter remains inside tolerance.\n- Any active-play frame gap over 200 ms invalidates ranking as FRAME STALL.\n- Repeated smaller clamped gaps invalidate once cumulative discarded wall time reaches 250 ms.\n- Any main-loop catch-up step-cap hit invalidates ranking as CATCH-UP LIMIT.\n- Lifecycle and viewport timing resets debit unsimulated wall time and accumulator residue before reset.\n- Transition and paused states are excluded from active-play timing enforcement.\n- F1 replay timestamp and F2 ranked-pause regressions remain green.\n\n**F3 disposition: PASS. VC-003 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F3 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-ranked-timing-source.mjs
          git diff --cached --check
          git commit -m 'F3: invalidate ranked runs on timing drift'
          git push origin HEAD:fix/v6.2-hardening
