name: F6 anonymous rate-limit hardening

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f6-anonymous-rate-limit-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F6 anonymous identity patch
        run: python3 leaderboard/scripts/f6-harden-anonymous-rate-limit.py

      - name: Validate Worker syntax
        working-directory: leaderboard
        run: npm run check

      - name: Run F4 replay resource regression
        working-directory: leaderboard
        run: node scripts/test-replay-resource-limits-source.mjs ../index.html

      - name: Run F5 replay hash regression
        working-directory: leaderboard
        run: node scripts/test-replay-hash-normalization-source.mjs

      - name: Run F6 anonymous rate-limit regression
        working-directory: leaderboard
        run: node scripts/test-anonymous-rate-limit-source.mjs

      - name: Mark F6 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old='| VC-006 | HIGH | Anonymous rate-limit identity uses IP + attacker-controlled User-Agent and is trivially splittable. | F6 | FIXED — VERIFYING |'
          new='| VC-006 | HIGH | Anonymous rate-limit identity uses IP + attacker-controlled User-Agent and is trivially splittable. | F6 | FIXED — F6 PASS |'
          if s.count(old)!=1:
              raise SystemExit('VC-006 verification status marker missing')
          s=s.replace(old,new,1)
          s += '''\n### F6 verification evidence\n\n- Two requests from the same `CF-Connecting-IP` produce the same anonymous limiter key even when `User-Agent` is changed, randomized or omitted.\n- Different trusted client IPs produce distinct anonymous limiter keys.\n- Missing trusted IP falls into the stable `ip:unknown` fail-closed bucket.\n- The anonymous key does not consult `User-Agent`, `X-Forwarded-For`, `X-Real-IP`, or other caller-controlled identity headers.\n- Profile creation and unauthenticated run-ticket issuance both use the hardened anonymous key.\n- Authenticated run-ticket and bearer-token submission throttling remain unchanged.\n- Cloudflare limiter namespaces, quotas and periods remain unchanged.\n- Worker syntax, F4 replay-resource regression and F5 replay-hash regression remain green.\n\n**F6 disposition: PASS. VC-006 closed.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f leaderboard/src/index.js design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-anonymous-rate-limit-source.mjs
          git diff --cached --check
          git commit -m 'F6: harden anonymous rate-limit identity'
          git push origin HEAD:fix/v6.2-hardening
