name: VOIDCUT release PWA certification

on:
  push:
    branches:
      - chatgpt/release-pwa-hardening
  pull_request:
    branches:
      - chatgpt/vd7-theme-responsive-certification

permissions:
  contents: read

jobs:
  certify-pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/release-pwa-hardening
          fetch-depth: 0

      - name: Static package contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct

          required=[
            'index.html','manifest.webmanifest','sw.js','icon.svg','icon-192.png','icon-512.png','icon-maskable-512.png',
            'design/voidcut-design-system.css','design/voidcut-design-system.js','design/RELEASE_PWA_README.md'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit('Missing package asset(s): '+', '.join(missing))

          html=Path('index.html').read_text(encoding='utf-8')
          for token in ['./manifest.webmanifest','./icon.svg','./icon-192.png',"register('./sw.js',{scope:'./'})"]:
            if token not in html: raise SystemExit('HTML packaging reference missing: '+token)

          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          expected={'id':'./','start_url':'./','scope':'./','display':'standalone','background_color':'#E9E4D8','theme_color':'#E9E4D8'}
          for k,v in expected.items():
            if manifest.get(k)!=v: raise SystemExit(f'Manifest {k}={manifest.get(k)!r}; expected {v!r}')
          icons=manifest.get('icons') or []
          required_icons={('./icon-192.png','192x192','any'),('./icon-512.png','512x512','any'),('./icon-maskable-512.png','512x512','maskable')}
          actual={(x.get('src'),x.get('sizes'),x.get('purpose')) for x in icons}
          if not required_icons.issubset(actual): raise SystemExit('Manifest icon contract mismatch')

          def png_size(path):
            data=Path(path).read_bytes()
            if data[:8]!=b'\x89PNG\r\n\x1a\n' or data[12:16]!=b'IHDR': raise SystemExit(path+' is not a valid PNG header')
            return struct.unpack('>II',data[16:24])
          expected_sizes={'icon-192.png':(192,192),'icon-512.png':(512,512),'icon-maskable-512.png':(512,512)}
          for p,size in expected_sizes.items():
            got=png_size(p)
            if got!=size: raise SystemExit(f'{p}: {got}, expected {size}')

          sw=Path('sw.js').read_text(encoding='utf-8')
          for token in ["VOIDCUT_CACHE_VERSION = '6.0.0-pwa1'",'cache.addAll(VOIDCUT_CORE_URLS)',"type === 'SKIP_WAITING'",'self.skipWaiting()','self.clients.claim()']:
            if token not in sw: raise SystemExit('Service-worker contract missing: '+token)
          if "self.addEventListener('install'" not in sw or "self.addEventListener('activate'" not in sw or "self.addEventListener('fetch'" not in sw:
            raise SystemExit('Service-worker lifecycle incomplete')

          for name,expected in {
            'voidcut-build':'6.0.0','voidcut-save-schema':'16','voidcut-replay-version':'8',
            'voidcut-arena-generation':'2','voidcut-director-generation':'6','voidcut-daily-generation':'1'
          }.items():
            m=re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"',html)
            if not m or m.group(1)!=expected: raise SystemExit(f'Release contract changed: {name}')

          print('Static PWA package contract PASS')
          print('Manifest icons:',sorted(actual))
          print('PNG dimensions:',expected_sizes)
          PY
          node --check sw.js

      - name: Confirm VD7 certified product blobs are unchanged
        run: |
          test "$(git rev-parse chatgpt/vd7-theme-responsive-certification:index.html)" = "$(git rev-parse HEAD:index.html)"
          test "$(git rev-parse chatgpt/vd7-theme-responsive-certification:design/voidcut-design-system.css)" = "$(git rev-parse HEAD:design/voidcut-design-system.css)"
          echo "VD7 certified product blobs unchanged"

      - name: Install Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser service-worker and offline certification
        run: |
          python3 -m http.server 4173 >/tmp/voidcut-pwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > pwa-certify.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const origin='http://127.0.0.1:4173';
          const core=[
            '/', '/index.html','/manifest.webmanifest','/icon.svg','/icon-192.png','/icon-512.png','/icon-maskable-512.png',
            '/design/voidcut-design-system.css','/design/voidcut-design-system.js'
          ];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
          const page=await context.newPage();
          const errors=[];
          const failed=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          page.on('requestfailed',r=>failed.push(r.url()+': '+(r.failure()?.errorText||'failed')));

          await page.goto(origin+'/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.VoidcutDesign && 'serviceWorker' in navigator);
          const manifestResponse=await page.request.get(origin+'/manifest.webmanifest');
          if(!manifestResponse.ok()) throw new Error('manifest fetch failed '+manifestResponse.status());
          const manifest=await manifestResponse.json();
          if(manifest.name!=='VOIDCUT'||manifest.start_url!=='./'||manifest.scope!=='./') throw new Error('manifest runtime contract mismatch');

          await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));
          await page.reload({waitUntil:'networkidle'});
          await page.waitForFunction(()=>navigator.serviceWorker.controller && window.VoidcutDesign && window.VoidcutCertification);

          const onlineAudit=await page.evaluate(async core=>{
            const reg=await navigator.serviceWorker.getRegistration('./');
            const keys=await caches.keys();
            const cache=await caches.open('voidcut-shell-6.0.0-pwa1');
            const checks={};
            for(const path of core){
              const u=new URL(path,location.origin).href;
              checks[path]=!!(await cache.match(u,{ignoreSearch:true}));
            }
            return {
              controlled:!!navigator.serviceWorker.controller,
              scope:reg?.scope||'',
              active:reg?.active?.state||'',
              waiting:!!reg?.waiting,
              keys,
              checks,
              title:document.title,
              visualPhase:document.querySelector('meta[name="voidcut-visual-phase"]')?.content||''
            };
          },core);
          if(!onlineAudit.controlled||onlineAudit.active!=='activated') throw new Error('service worker is not active/controller');
          if(!onlineAudit.scope.endsWith('/')) throw new Error('service worker scope is invalid: '+onlineAudit.scope);
          if(!onlineAudit.keys.includes('voidcut-shell-6.0.0-pwa1')) throw new Error('release cache missing');
          for(const [path,ok] of Object.entries(onlineAudit.checks)) if(!ok) throw new Error('precache missing '+path);
          if(onlineAudit.title!=='VOIDCUT'||onlineAudit.visualPhase!=='VD7') throw new Error('controlled product boot mismatch');

          const cdp=await context.newCDPSession(page);
          const appManifest=await cdp.send('Page.getAppManifest');
          if((appManifest.errors||[]).length) throw new Error('manifest parser errors: '+JSON.stringify(appManifest.errors));
          try{
            const installability=await cdp.send('Page.getInstallabilityErrors');
            if((installability.installabilityErrors||[]).length) throw new Error('installability errors: '+JSON.stringify(installability.installabilityErrors));
          }catch(error){
            if(String(error).includes('installability errors:')) throw error;
            console.log('Page.getInstallabilityErrors unavailable; continuing with manifest/SW/offline gates');
          }

          await context.setOffline(true);
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.VoidcutDesign && window.VoidcutCertification && navigator.serviceWorker.controller);
          const offline=await page.evaluate(()=>({title:document.title,phase:document.querySelector('meta[name="voidcut-visual-phase"]')?.content||'',controller:!!navigator.serviceWorker.controller,menuVisible:!document.getElementById('menu')?.classList.contains('hidden')}));
          if(offline.title!=='VOIDCUT'||offline.phase!=='VD7'||!offline.controller||!offline.menuVisible) throw new Error('offline boot contract failed: '+JSON.stringify(offline));
          await context.setOffline(false);

          // Update behavior: create a second worker revision with a distinct cache version.
          // It must install into a separate cache and WAIT until the app explicitly sends SKIP_WAITING.
          const originalSW=fs.readFileSync('sw.js','utf8');
          const updatedSW=originalSW.replace("6.0.0-pwa1","6.0.0-pwa2-test");
          if(updatedSW===originalSW) throw new Error('could not construct test worker revision');
          fs.writeFileSync('sw.js',updatedSW);
          const updateState=await page.evaluate(async()=>{
            const reg=await navigator.serviceWorker.getRegistration('./');
            await reg.update();
            const deadline=Date.now()+10000;
            while(!reg.waiting&&Date.now()<deadline) await new Promise(r=>setTimeout(r,50));
            const keys=await caches.keys();
            return {waiting:!!reg.waiting,activeState:reg.active?.state||'',keys,controller:!!navigator.serviceWorker.controller};
          });
          if(!updateState.waiting) throw new Error('updated worker did not wait');
          if(!updateState.keys.includes('voidcut-shell-6.0.0-pwa1')||!updateState.keys.includes('voidcut-shell-6.0.0-pwa2-test')) throw new Error('atomic parallel caches missing: '+JSON.stringify(updateState.keys));

          const applied=await page.evaluate(async()=>{
            const reg=await navigator.serviceWorker.getRegistration('./');
            const changed=new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',()=>resolve(true),{once:true}));
            reg.waiting.postMessage({type:'SKIP_WAITING'});
            await Promise.race([changed,new Promise((_,reject)=>setTimeout(()=>reject(new Error('controllerchange timeout')),10000))]);
            await new Promise(r=>setTimeout(r,100));
            return {keys:await caches.keys(),controller:!!navigator.serviceWorker.controller};
          });
          if(!applied.controller) throw new Error('updated worker failed to control page');
          if(applied.keys.includes('voidcut-shell-6.0.0-pwa1')||!applied.keys.includes('voidcut-shell-6.0.0-pwa2-test')) throw new Error('old cache cleanup failed: '+JSON.stringify(applied.keys));

          // Restore checkout file only for cleanliness of the ephemeral runner.
          fs.writeFileSync('sw.js',originalSW);

          if(errors.length) throw new Error('browser errors: '+JSON.stringify(errors));
          if(failed.length) throw new Error('request failures: '+JSON.stringify(failed));
          console.log('ONLINE AUDIT',JSON.stringify(onlineAudit));
          console.log('OFFLINE AUDIT',JSON.stringify(offline));
          console.log('UPDATE WAIT AUDIT',JSON.stringify(updateState));
          console.log('UPDATE APPLY AUDIT',JSON.stringify(applied));
          console.log('VOIDCUT PWA BROWSER CERTIFICATION PASS');
          await browser.close();
          JS
          node pwa-certify.mjs
          rm pwa-certify.mjs
