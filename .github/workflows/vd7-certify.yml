name: VD7 theme responsive certification

on:
  push:
    branches:
      - chatgpt/vd7-theme-responsive-certification
  pull_request:
    branches:
      - chatgpt/vd6-system-utility-reconstruction

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out VD7 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vd7-theme-responsive-certification
          fetch-depth: 0

      - name: Apply VD7 certification layer
        run: python3 design/vd7_patch.py

      - name: Static contract and contrast gate
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('design/voidcut-design-system.css').read_text(encoding='utf-8')

          required=[
            'name="voidcut-visual-phase" content="VD7"',
            '/* === VD7 THEME SUITE + RESPONSIVE CERTIFICATION',
            "const VD7_CERT_VERSION='VD7.0.0'",
            "Object.defineProperty(window,'VoidcutCertification'",
            "const VD6_SYSTEM_VERSION='VD6.0.0'",
            "const VD5_COSMETICS_VERSION='VD5.0.0'",
            "const VD4_SECONDARY_VERSION='VD4.0.0'",
            "const VD3_SHELL_VERSION='VD3.0.0'",
            "const VD2_HUD_VERSION='VD2.0.0'",
            'drawCoreLightField(){return}',
            'vd7Initialize();renderToggles()',
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing VD7 contract token(s): '+', '.join(missing))

          for name,expected in {
            'voidcut-build':'6.0.0','voidcut-save-schema':'16','voidcut-replay-version':'8',
            'voidcut-arena-generation':'2','voidcut-director-generation':'6','voidcut-daily-generation':'1'
          }.items():
            m=re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"',html)
            if not m or m.group(1)!=expected: raise SystemExit(f'Contract changed: {name}')

          for token in ["arcade:{","sunset:{","ion:{","ice:{","vector:{","spectrum:{","availablePaletteIds(s)"]:
            if token not in html: raise SystemExit('Stable theme/save compatibility missing: '+token)

          def rgb(h):
            h=h.lstrip('#')
            return [int(h[i:i+2],16)/255 for i in (0,2,4)]
          def lum(h):
            out=[]
            for c in rgb(h): out.append(c/12.92 if c<=.04045 else ((c+.055)/1.055)**2.4)
            return .2126*out[0]+.7152*out[1]+.0722*out[2]
          def cr(a,b):
            x,y=lum(a),lum(b)
            return (max(x,y)+.05)/(min(x,y)+.05)

          themes=['paper','carbon','cobalt','kelp','plum','mono']
          required_tokens=['--vc-bg','--vc-bg-ink','--vc-bg-ink-muted','--vc-surface','--vc-ink','--vc-ink-secondary','--vc-ink-muted','--vc-accent','--vc-on-accent']
          rows=[]
          for theme in themes:
            m=re.search(rf'html\[data-vc-theme="{theme}"\]\s*\{{(.*?)\n\}}',css,re.S)
            if not m: raise SystemExit('Theme block missing: '+theme)
            block=m.group(1)
            vals={}
            for token in required_tokens:
              q=re.search(rf'{re.escape(token)}:\s*(#[0-9A-Fa-f]{{6}})',block)
              if not q: raise SystemExit(f'{theme}: concrete token missing: {token}')
              vals[token]=q.group(1)
            pairs={
              'bg':('--vc-bg-ink','--vc-bg'),
              'bg-muted':('--vc-bg-ink-muted','--vc-bg'),
              'surface':('--vc-ink','--vc-surface'),
              'secondary':('--vc-ink-secondary','--vc-surface'),
              'muted':('--vc-ink-muted','--vc-surface'),
              'accent':('--vc-on-accent','--vc-accent'),
            }
            result={k:cr(vals[a],vals[b]) for k,(a,b) in pairs.items()}
            bad={k:v for k,v in result.items() if v<4.5-1e-6}
            if bad: raise SystemExit(f'{theme}: contrast below 4.5:1: {bad}')
            rows.append((theme,result))
          for theme,row in rows:
            print(theme, ' '.join(f'{k}={v:.2f}' for k,v in row.items()))

          HTMLParser().feed(html)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=max(scripts,key=len)
          Path('/tmp/voidcut-inline.js').write_text(inline,encoding='utf-8')
          print('VD7 static + contrast PASS')
          print('HTML bytes:',len(html.encode('utf-8')))
          print('Design CSS bytes:',len(css.encode('utf-8')))
          print('Inline JS bytes:',len(inline.encode('utf-8')))
          PY
          node --check /tmp/voidcut-inline.js

      - name: Install Chromium certification runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser matrix certification
        run: |
          python3 -m http.server 4173 >/tmp/vd7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/vd7-browser.mjs <<'JS'
          import { chromium } from 'playwright';

          const viewports=[
            ['PHONE-S',360,640],['PHONE-M',390,844],['PHONE-L',412,915],
            ['TABLET-P',768,1024],['TABLET-L',820,1180],
            ['DESKTOP-720',1280,720],['DESKTOP-900',1440,900],
            ['DESKTOP-FHD',1920,1080],['DESKTOP-QHD',2560,1440],['ULTRAWIDE',3440,1440]
          ];
          const themes=['paper','carbon','cobalt','kelp','plum','mono'];
          const screenTargets=['menu','recordsPanel','competitionPanel','masteryPanel','cosmeticsPanel','settingsPanel','diagnosticsPanel','pausePanel','result','replayHud'];
          const forbidden=['rgb(45, 226, 255)','rgba(45, 226, 255','rgb(255, 45, 158)','rgba(255, 45, 158'];
          const browser=await chromium.launch({headless:true});
          const failures=[];
          let checks=0;

          function fail(msg){ failures.push(msg); }
          async function load(page){
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text())});
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.VoidcutCertification&&window.VoidcutDesign);
            await page.waitForTimeout(80);
            return errors;
          }
          async function setTheme(page,theme){
            await page.evaluate(theme=>{window.VoidcutDesign.applyTheme(theme,{persist:false});window.VoidcutCertification.syncThemeColor()},theme);
            await page.waitForTimeout(20);
          }
          async function inspect(page,label,screenId,scanLeak){
            const result=await page.evaluate(({screenId,scanLeak,forbidden})=>{
              if(screenId!=='menu'){
                document.querySelectorAll('.overlay').forEach(el=>el.classList.add('hidden'));
                const menu=document.getElementById('menu'); if(menu) menu.classList.add('hidden');
                const target=document.getElementById(screenId); if(target) target.classList.remove('hidden');
              } else {
                document.querySelectorAll('.overlay').forEach(el=>el.classList.add('hidden'));
                document.getElementById('menu')?.classList.remove('hidden');
              }
              if(screenId==='replayHud') document.getElementById('wrap')?.style.setProperty('display','block');
              const target=document.getElementById(screenId);
              const root=document.documentElement;
              const audit=window.VoidcutCertification.audit();
              const activeOverflow=target&&target.scrollWidth>target.clientWidth+1;
              let leaks=[];
              if(scanLeak&&target){
                const els=[target,...target.querySelectorAll('*')].filter(el=>{
                  const s=getComputedStyle(el),r=el.getBoundingClientRect();
                  return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
                }).slice(0,900);
                const props=['color','backgroundColor','backgroundImage','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor','boxShadow','textShadow','filter','outlineColor'];
                for(const el of els){
                  for(const pseudo of [null,'::before','::after']){
                    const s=getComputedStyle(el,pseudo);
                    const text=props.map(p=>s[p]||'').join('|');
                    if(forbidden.some(x=>text.includes(x))){
                      leaks.push({tag:el.tagName,id:el.id,cls:String(el.className||'').slice(0,80),pseudo:pseudo||'self',text:text.slice(0,220)});
                      break;
                    }
                  }
                  if(leaks.length>=8)break;
                }
              }
              return {audit,activeOverflow,rootOverflow:root.scrollWidth>innerWidth+1,bodyOverflow:document.body.scrollWidth>innerWidth+1,leaks};
            },{screenId,scanLeak,forbidden});
            checks++;
            if(result.rootOverflow||result.bodyOverflow||result.activeOverflow) fail(`${label}/${screenId}: horizontal overflow root=${result.rootOverflow} body=${result.bodyOverflow} active=${result.activeOverflow}`);
            if(result.audit.touchFailures.length) fail(`${label}/${screenId}: touch targets ${JSON.stringify(result.audit.touchFailures.slice(0,5))}`);
            if(!result.audit.themeSuite) fail(`${label}/${screenId}: theme suite runtime contrast failed`);
            if(!result.audit.themeColorSynced) fail(`${label}/${screenId}: theme-color not synced`);
            if(result.leaks.length) fail(`${label}/${screenId}: legacy cyan/magenta computed leak ${JSON.stringify(result.leaks)}`);
          }

          for(const [name,width,height] of viewports){
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=await load(page);
            for(const theme of themes){
              await setTheme(page,theme);
              await inspect(page,`${name}/${theme}`,'menu',true);
            }
            await setTheme(page,'paper');
            for(const screenId of screenTargets.filter(x=>x!=='menu')) await inspect(page,`${name}/paper`,screenId,true);
            if(errors.length) fail(`${name}: runtime errors ${JSON.stringify(errors)}`);
            await context.close();
          }
          await browser.close();
          console.log(`VD7 browser checks: ${checks}`);
          if(failures.length){
            console.error('VD7 BROWSER CERTIFICATION FAIL');
            for(const f of failures.slice(0,80)) console.error('- '+f);
            process.exit(1);
          }
          console.log('VD7 browser matrix PASS');
          JS
          node /tmp/vd7-browser.mjs

      - name: Commit certified VD7 product files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html design/voidcut-design-system.css; then
            echo "VD7 product files already certified"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html design/voidcut-design-system.css
          git commit -m "VD7: certify themes and responsive system"
          git push origin HEAD:chatgpt/vd7-theme-responsive-certification
