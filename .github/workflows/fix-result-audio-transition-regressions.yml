name: Fix VOIDCUT result, audio and transition regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-result-audio-transition-regressions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".leaderboard-join{width:min(620px,92vw);padding:15px 16px;margin:2px 0 4px;border:1px solid var(--vc-line-strong);background:var(--vc-surface);color:var(--vc-ink);text-align:left}\n.leaderboard-join-copy{display:flex;flex-direction:column;gap:3px}.leaderboard-join-copy strong{font:800 14px var(--vc-font-sans);letter-spacing:.06em}.leaderboard-join-copy span,.leaderboard-join-status{font:600 10px var(--vc-font-mono);color:var(--vc-ink-muted)}\n.leaderboard-join-form{display:grid;grid-template-columns:1fr 112px;gap:8px;margin-top:10px}.leaderboard-join-form input{min-height:46px;padding:0 12px;border:1px solid var(--vc-line-strong);background:var(--vc-bg);color:var(--vc-bg-ink);font:700 14px var(--vc-font-mono);text-transform:uppercase}.leaderboard-join-form button{min-height:46px}.leaderboard-join-status{min-height:14px;margin-top:7px}\n@media(max-width:480px){#competitionPanel .competition-head,#competitionPanel .competition-row{grid-template-columns:38px minmax(86px,1fr) minmax(88px,1fr) 58px!important}.leaderboard-join-form{grid-template-columns:1fr}.leaderboard-join-form button{width:100%}}"
          new_css = ".leaderboard-join{width:100%;max-width:100%;min-width:0;padding:15px 16px;margin:8px 0 4px;border:1px solid var(--vc-line-strong);background:var(--vc-surface);color:var(--vc-ink);text-align:left;box-sizing:border-box;overflow:hidden}\n.leaderboard-join-copy{display:flex;flex-direction:column;gap:3px}.leaderboard-join-copy strong{font:800 14px var(--vc-font-sans);letter-spacing:.06em}.leaderboard-join-copy span,.leaderboard-join-status{font:600 10px var(--vc-font-mono);color:var(--vc-ink-muted)}\n.leaderboard-join-form{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px;min-width:0}.leaderboard-join-form input{display:block;width:100%;max-width:100%;min-width:0;min-height:46px;padding:0 12px;border:1px solid var(--vc-line-strong);background:var(--vc-bg);color:var(--vc-bg-ink);font:700 14px var(--vc-font-mono);text-transform:uppercase;box-sizing:border-box}.leaderboard-join-form button{display:block;width:100%;min-width:0;min-height:46px}.leaderboard-join-status{min-height:14px;margin-top:7px;overflow-wrap:anywhere}\n@media(max-width:480px){#competitionPanel .competition-head,#competitionPanel .competition-row{grid-template-columns:38px minmax(86px,1fr) minmax(88px,1fr) 58px!important}}\n/* Result regression fix: the old global screen-cut overlay was visually intrusive. */\n.vc-screen-cut{display:none!important}"
          if old_css not in s:
              raise SystemExit('Leaderboard CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          pattern = re.compile(r"function screenCutTransition\(tone='cyan'\)\{\n if\(motionReduced\(\)\)return;\n const el=\$\('screenCutFx'\);if\(!el\)return;clearTimeout\(screenCutTimer\);el\.dataset\.tone=tone;el\.classList\.remove\('run'\);void el\.offsetWidth;el\.classList\.add\('run'\);screenCutTimer=setTimeout\(\(\)=>el\.classList\.remove\('run'\),MOTION\.ui\+40\)\n\}")
          if len(pattern.findall(s)) != 1:
              raise SystemExit('screenCutTransition anchor not unique')
          s = pattern.sub("function screenCutTransition(){/* intentionally disabled: navigation should not flash a center-screen overlay */}", s, count=1)

          death = "function deathSound(){/* finite by design: impact -> low rupture -> silence */noiseBurst(.115,.0135,365,0,'lowpass');sweepTone(132,46,.33,.0175,'sine');tone(54,.23,.0095,'sine',.035)}"
          replacement = death + "\nfunction suspendAudioAfterDeath(){setTimeout(()=>{if((state==='dying'||state==='result')&&audio?.state==='running'){try{stopCutHum();stopAmbient(true);audio.suspend?.()}catch{}}},480)}"
          if s.count(death) != 1:
              raise SystemExit('deathSound anchor not unique')
          s = s.replace(death, replacement, 1)

          die_anchor = "haptic([38,24,62]);deathSound();setTimeout(()=>{const completed=finishRunRecord();"
          die_replacement = "haptic([38,24,62]);deathSound();suspendAudioAfterDeath();setTimeout(()=>{const completed=finishRunRecord();"
          if s.count(die_anchor) != 1:
              raise SystemExit('die audio anchor not unique')
          s = s.replace(die_anchor, die_replacement, 1)

          required = [
              '.leaderboard-join{width:100%;max-width:100%;min-width:0',
              '.leaderboard-join-form{display:grid;grid-template-columns:minmax(0,1fr)',
              '.vc-screen-cut{display:none!important}',
              'function screenCutTransition(){/* intentionally disabled',
              'function suspendAudioAfterDeath()',
              'deathSound();suspendAudioAfterDeath();setTimeout',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing fix markers: ' + ', '.join(missing))

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          old = "const VOIDCUT_CACHE_VERSION = '6.1.0-pwa2';"
          if old not in w:
              raise SystemExit('Expected pwa2 cache version')
          sw.write_text(w.replace(old, "const VOIDCUT_CACHE_VERSION = '6.1.0-pwa3';", 1), encoding='utf-8')
          print('Applied result form, death audio and transition fixes.')
          PY

      - name: Validate patched game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/voidcut-fixed.js').write_text(max(scripts,key=len),encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('Duplicate DOM IDs: '+', '.join(dup))
          PY
          node --check /tmp/voidcut-fixed.js
          grep -q "6.1.0-pwa3" sw.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-result-audio-transition-regressions.yml
          git add index.html sw.js
          git commit -m "Fix result form, death audio and screen transition"
          git push
