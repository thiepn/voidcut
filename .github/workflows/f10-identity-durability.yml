name: F10 leaderboard identity durability

on:
  push:
    branches: [fix/v6.2-hardening]
    paths:
      - '.github/workflows/f10-identity-durability.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply F10 identity durability patch
        run: |
          python3 leaderboard/scripts/f10-harden-identity-durability.py
          python3 leaderboard/scripts/f10-preserve-f8-ranked-start-regression.py

      - name: Validate inline runtime syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw new Error('inline runtime script missing');
          for(const source of scripts)new Function(source);
          console.log('inline runtime syntax PASS');
          NODE

      - name: Validate Worker syntax
        working-directory: leaderboard
        run: npm run check

      - name: Run F1 replay timing regression
        working-directory: leaderboard
        run: node scripts/test-replay-timing-source.mjs ../index.html

      - name: Run F2 ranked pause regression
        working-directory: leaderboard
        run: node scripts/test-ranked-pause-source.mjs ../index.html

      - name: Run F3 ranked timing regression
        working-directory: leaderboard
        run: node scripts/test-ranked-timing-source.mjs ../index.html

      - name: Run F4 replay resource regression
        working-directory: leaderboard
        run: node scripts/test-replay-resource-limits-source.mjs ../index.html

      - name: Run F5 replay hash regression
        working-directory: leaderboard
        run: node scripts/test-replay-hash-normalization-source.mjs

      - name: Run F6 anonymous rate-limit regression
        working-directory: leaderboard
        run: node scripts/test-anonymous-rate-limit-source.mjs

      - name: Run F7 Turnstile contract regression
        working-directory: leaderboard
        run: node scripts/test-turnstile-contract-source.mjs

      - name: Run F8 ranked start regression
        working-directory: leaderboard
        run: node scripts/test-ranked-start-ticket-source.mjs

      - name: Run F9 persistent queue regression
        working-directory: leaderboard
        run: node scripts/test-persistent-submission-queue-source.mjs

      - name: Run F10 identity durability regression
        working-directory: leaderboard
        run: node scripts/test-leaderboard-identity-durability-source.mjs

      - name: Mark F10 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design/V6_2_HARDENING_FIX_REGISTER.md')
          s=p.read_text(encoding='utf-8')
          old10='| VC-010 | MEDIUM | Profile creation ignores failure to persist/read back local leaderboard identity, potentially orphaning the username/token relationship. | F10 | FIXED — VERIFYING |'
          new10='| VC-010 | MEDIUM | Profile creation ignores failure to persist/read back local leaderboard identity, potentially orphaning the username/token relationship. | F10 | FIXED — F10 PASS |'
          old27='| VC-027 | LOW | Leaderboard identity is outside the normal full-save export/import path; profile ownership is not portable/recoverable through the current backup flow. | F10/F24 | FIXED — VERIFYING; F24 AUDIT PENDING |'
          new27='| VC-027 | LOW | Leaderboard identity is outside the normal full-save export/import path; profile ownership is not portable/recoverable through the current backup flow. | F10/F24 | FIXED — F10 PASS; F24 AUDIT PENDING |'
          if s.count(old10)!=1 or s.count(old27)!=1:
              raise SystemExit('F10 verification status markers missing')
          s=s.replace(old10,new10,1).replace(old27,new27,1)
          s += '''\n### F10 verification evidence\n\n- Identity normalization rejects malformed ownership records while preserving the existing public-name character contract.\n- A successful identity store writes checksummed primary and backup snapshots and immediately verifies both by readback.\n- Legacy raw identity storage is accepted and automatically repaired into the redundant envelope format.\n- Corrupt primary storage recovers from backup and repairs primary; corrupt backup storage recovers from primary and repairs backup; two invalid copies fail closed.\n- Clearing identity removes both persistent copies, storage-test residue and the emergency in-memory credential.\n- Storage self-test failure is detected before `/profile/create`, so the server is not asked to create an ownership record the browser cannot persist.\n- The post-create path checks `storeLeaderboardIdentity()` before any F9 queue drain and exposes an emergency export instruction if the write/readback fails.\n- Authenticated leaderboard requests continue to use only the durable loader, not the emergency in-memory credential.\n- Full-save `f:3` checksum covers both save data and optional identity; tampering either changes the package checksum.\n- Full-save import remains compatible with legacy `f:1` / `f:2` envelopes and restores validated `f:3` ownership through the redundant persistence path.\n- Save schema stays 17 and replay/gameplay contracts remain unchanged.\n- Inline runtime parses successfully, Worker syntax remains green, and permanent F1-F9 regressions remain green.\n\n**F10 disposition: PASS. VC-010 closed. VC-027 functionally closed, with destructive portability/recovery audit retained for F24.**\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit F10 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html leaderboard/client/global-leaderboard-runtime.js design/V6_2_HARDENING_FIX_REGISTER.md leaderboard/scripts/test-ranked-start-ticket-source.mjs leaderboard/scripts/test-leaderboard-identity-durability-source.mjs
          git diff --cached --check
          git commit -m 'F10: harden leaderboard identity durability'
          git push origin HEAD:fix/v6.2-hardening
