name: Switch VOIDCUT leaderboard endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-voidcut-leaderboard-endpoint.yml'

permissions:
  contents: write

jobs:
  switch-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace custom API hostname with deployed Worker endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://voidcut-api.thiepn.dev'
          new='https://voidcut-leaderboard.thiepn.workers.dev'
          n=s.count(old)
          if n < 1:
              raise SystemExit(f'Expected at least one old leaderboard endpoint; found {n}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          old_cache="const VOIDCUT_CACHE_VERSION = '6.1.0-pwa1';"
          if old_cache not in t:
              raise SystemExit('Expected v6.1.0-pwa1 service-worker cache')
          sw.write_text(t.replace(old_cache,"const VOIDCUT_CACHE_VERSION = '6.1.0-pwa2';"),encoding='utf-8')
          PY

      - name: Validate endpoint and JavaScript
        run: |
          grep -q "https://voidcut-leaderboard.thiepn.workers.dev" index.html
          ! grep -q "https://voidcut-api.thiepn.dev" index.html
          grep -q "6.1.0-pwa2" sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/voidcut-endpoint.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/voidcut-endpoint.js

      - name: Commit endpoint switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/switch-voidcut-leaderboard-endpoint.yml
          git add index.html sw.js
          git commit -m "Activate deployed VOIDCUT leaderboard API"
          git push
