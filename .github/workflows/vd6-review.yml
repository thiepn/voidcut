name: VD6 system utility certification

on:
  pull_request:
    branches:
      - chatgpt/vd5-cosmetics-reconstruction
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-utilities:
    runs-on: ubuntu-latest
    steps:
      - name: Check out VD6 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vd6-system-utility-reconstruction
          fetch-depth: 0

      - name: Apply VD6 certification corrections
        run: python3 design/vd6_review_patch.py

      - name: Validate final VD6 contract
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'name="voidcut-visual-phase" content="VD6"',
            '/* === VD6 SYSTEM + UTILITY RECONSTRUCTION',
            '/* === VD6 CERTIFICATION CORRECTIONS',
            "const VD6_SYSTEM_VERSION='VD6.0.0'",
            "Object.defineProperty(window,'VoidcutUtilities'",
            "arcade:'paper'", "sunset:'carbon'", "ion:'cobalt'",
            "ice:'kelp'", "vector:'plum'", "spectrum:'mono'",
            'id="textureMode"','vd6-replay-instrument','vd6-report-sheet',
            'CUTFORM PHYSICAL GRAPHICS + ADAPTIVE AUDIO',
            '.diag-box.warn', "status='warn'",
            "const VD5_COSMETICS_VERSION='VD5.0.0'",
            "const VD4_SECONDARY_VERSION='VD4.0.0'",
            "const VD3_SHELL_VERSION='VD3.0.0'",
            "const VD2_HUD_VERSION='VD2.0.0'",
            'drawCoreLightField(){return}',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing final VD6 tokens: '+', '.join(missing))
          if 'Global neon color scheme' in text[text.index('<section id="settingsPanel"'):text.index('<section id="diagnosticsPanel"')]: raise SystemExit('Legacy neon Settings copy remains')
          for name,expected in {
            'voidcut-build':'6.0.0','voidcut-save-schema':'16','voidcut-replay-version':'8',
            'voidcut-arena-generation':'2','voidcut-director-generation':'6','voidcut-daily-generation':'1'
          }.items():
            m=re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"',text)
            if not m or m.group(1)!=expected: raise SystemExit(f'Contract changed: {name}')
          HTMLParser().feed(text)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          inline=max(scripts,key=len)
          Path('/tmp/voidcut-inline.js').write_text(inline,encoding='utf-8')
          print('VD6 certification PASS')
          print('HTML bytes:',len(text.encode('utf-8')))
          print('Inline JS bytes:',len(inline.encode('utf-8')))
          PY
          node --check /tmp/voidcut-inline.js

      - name: Commit certification corrections
        run: |
          if git diff --quiet -- index.html; then
            echo "VD6 certification corrections already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "VD6: certify system utility layer"
          git push origin HEAD:chatgpt/vd6-system-utility-reconstruction
