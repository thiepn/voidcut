name: VOIDCUT RC apply Firefox notice fix

on:
  push:
    branches:
      - chatgpt/v6-final-release-candidate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6-final-release-candidate
          fetch-depth: 0
      - name: Apply harness-only Firefox compatibility filters
        run: |
          python3 design/rc_firefox_notice_patch.py
          python3 design/rc_firefox_notice_patch2.py
          node --check design/rc_browser_certify.mjs
      - name: Commit harness correction
        run: |
          if git diff --quiet -- design/rc_browser_certify.mjs; then
            echo "Harness correction already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/rc_browser_certify.mjs
          git commit -m "RC: harden Firefox interactive-widget notice filter"
          git push origin HEAD:chatgpt/v6-final-release-candidate
